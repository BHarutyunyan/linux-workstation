# My GNOME settings, picked by hand from "dconf dump /" on the ThinkPad E16.
# Loaded by install.sh with:  dconf load / < gnome/settings.ini
# Left out on purpose: recent folders, window sizes, notification lists,
# app-grid order, and anything that only fits the E16 (Windows switch icon).
# To refresh one section from a live machine:  dconf dump /org/gnome/desktop/interface/

[org/gnome/desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'ru+phonetic'), ('xkb', 'am+phonetic')]
mru-sources=[('xkb', 'us'), ('xkb', 'ru+phonetic'), ('xkb', 'am+phonetic')]
per-window=false
xkb-options=@as []

[org/gnome/desktop/interface]
accent-color='green'
color-scheme='prefer-dark'
gtk-theme='Yaru-olive-dark'
icon-theme='Yaru-olive-dark'
enable-hot-corners=true
show-battery-percentage=true

[org/gnome/desktop/background]
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/mizuno-as-Big_Dipper.jpg'
picture-uri-dark='file:///usr/share/backgrounds/mizuno-as-Big_Dipper.jpg'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/screensaver]
lock-delay=uint32 30
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/mizuno-as-Big_Dipper.jpg'

[org/gnome/desktop/session]
idle-delay=uint32 480

# ---- my keys
[org/gnome/desktop/wm/keybindings]
close=['<Super>KP_Subtract']
switch-panels-backward=['<Super>z']

[org/gnome/settings-daemon/plugins/media-keys]
shutdown=['<Super>KP_Multiply']
magnifier-zoom-in=['<Control>equal']

[org/gnome/shell/keybindings]
toggle-application-view=@as []

[org/gnome/desktop/peripherals/keyboard]
numlock-state=true

[org/gnome/desktop/peripherals/mouse]
natural-scroll=false

[org/gnome/desktop/peripherals/touchpad]
click-method='fingers'
natural-scroll=true
tap-to-click=true
two-finger-scrolling-enabled=true

# ---- night light, power, privacy
[org/gnome/settings-daemon/plugins/color]
night-light-enabled=true
night-light-schedule-automatic=false
night-light-schedule-from=19.0
night-light-temperature=uint32 4223

[org/gnome/settings-daemon/plugins/power]
power-button-action='suspend'
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'

[org/gnome/desktop/privacy]
report-technical-problems=false

[org/gnome/system/location]
enabled=false

# ---- shell, dock, extensions (they switch on after the next login)
[org/gnome/shell]
enabled-extensions=['ding@rastersoft.com', 'ubuntu-dock@ubuntu.com', 'tiling-assistant@ubuntu.com', 'hidetopbar@mathieu.bidon.ca', 'hide-cursor@elcste.com', 'dock-keyboard-autohide@boris', 'soft-brightness-plus@joelkitching.com']
disabled-extensions=@as []
favorite-apps=['chatgpt.desktop', 'com.anthropic.Claude.desktop', 'brave-browser.desktop', 'org.gnome.Nautilus.desktop', 'thunderbird_thunderbird.desktop']

[org/gnome/shell/app-switcher]
current-workspace-only=false

[org/gnome/mutter]
dynamic-workspaces=true
workspaces-only-on-primary=false

[org/gnome/shell/extensions/dash-to-dock]
dash-max-icon-size=48
dock-fixed=false
dock-position='BOTTOM'
extend-height=false
intellihide=false
isolate-monitors=false
isolate-workspaces=false
multi-monitor=false
show-mounts=false
show-mounts-network=true
show-mounts-only-mounted=false
show-trash=false

[org/gnome/shell/extensions/ding]
icon-size='standard'
show-home=false

[org/gnome/shell/extensions/hidetopbar]
enable-active-window=false
enable-intellihide=false
mouse-sensitive=true
pressure-threshold=100
shortcut-keybind=['KP_Add']
show-in-overview=false

[org/gnome/shell/extensions/hide-cursor-elcste-com]
timeout=2

[org/gnome/shell/extensions/tiling-assistant]
focus-hint-color='rgb(203,67,20)'
tiling-popup-all-workspace=true

# ---- apps
[org/gnome/Ptyxis]
interface-style='dark'

[org/gtk/settings/file-chooser]
date-format='regular'
location-mode='path-bar'
show-hidden=false
show-size-column=true
show-type-column=true
sort-column='name'
sort-directories-first=true
sort-order='ascending'
type-format='category'

[org/gtk/gtk4/settings/file-chooser]
show-hidden=false
sort-directories-first=true
